name: Build and Package Faiss Linux

on:
  push:
    branches: [ main ]
    paths:
      - "faiss"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            opt_level: generic
          - arch: arm64
            runner: ubuntu-24.04-arm
            opt_level: generic
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Install Git
      run: |
        sudo apt-get update
        sudo apt-get install -y git

    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Build Dependencies
      run: |
        sudo apt-get install -y cmake g++ libopenblas-dev liblapack-dev

    - name: Configure Faiss
      working-directory: faiss
      run: |
        cmake -B build . \
          -DFAISS_ENABLE_C_API=ON \
          -DBUILD_SHARED_LIBS=ON \
          -DFAISS_ENABLE_GPU=OFF \
          -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} \
          -DFAISS_ENABLE_MKL=OFF \
          -DFAISS_ENABLE_PYTHON=OFF \
          -DBUILD_TESTING=OFF \
          -DFAISS_ENABLE_EXTRAS=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DCMAKE_INSTALL_RPATH='$ORIGIN'

    - name: Build Faiss C API
      working-directory: faiss
      run: |
        make -C build -j $(nproc) faiss_c

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp faiss/build/c_api/libfaiss_c.so artifacts/
        cp faiss/build/faiss/libfaiss.so artifacts/

    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        compression-level: '9'
        name: faiss-linux-${{ matrix.arch }}-binaries.zip
        path: artifacts/*

  build-pack:
    needs: [build]
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
  
      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-linux-x64-binaries.zip
          path: x64
  
      - name: Download ARM64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-linux-arm64-binaries.zip
          path: arm64

      - name: Prepare Native Runtimes
        run: |
          cp x64/* src/FaissNET.Linux/runtimes/linux-x64/native/
          cp arm64/* src/FaissNET.Linux/runtimes/linux-arm64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
  
      - name: Pack NuGet Package
        run: |
          dotnet pack src/FaissNET.Linux/Faiss.Linux.csproj -c Release -o ./nupkg
  
      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: faiss-linux-nupkg.zip
          path: '**/*.nupkg'

  build-cuda:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            cuda_arch: x86_64
            opt_level: generic
          - arch: arm64
            runner: ubuntu-24.04-arm
            cuda_arch: sbsa
            opt_level: generic
    runs-on: ${{ matrix.runner }}

    env:
      CUDA_HOME: /usr/local/cuda-12.8

    steps:
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda-12.8/bin" >> $GITHUB_PATH

      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install CUDA Repository
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/${{ matrix.cuda_arch }}/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y cmake g++ libopenblas-dev liblapack-dev \
            cuda-nvcc-12-8 cuda-cudart-dev-12-8 cuda-profiler-api-12-8 libcublas-dev-12-8 libcurand-dev-12-8

      - name: Configure Faiss
        working-directory: faiss
        run: |
          cmake -B build . \
            -DFAISS_ENABLE_C_API=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DFAISS_ENABLE_GPU=ON \
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} \
            -DFAISS_ENABLE_MKL=OFF \
            -DFAISS_ENABLE_PYTHON=OFF \
            -DBUILD_TESTING=OFF \
            -DFAISS_ENABLE_EXTRAS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_CUDA_ARCHITECTURES="50;52;60;61;75;80;86;89;90;120" \
            -DCMAKE_CUDA_ARCHITECTURES="120"

      - name: Build Faiss C API
        working-directory: faiss
        run: |
          make -C build -j $(nproc) faiss_c

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp faiss/build/c_api/libfaiss_c.so artifacts/
          cp faiss/build/faiss/libfaiss.so artifacts/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          compression-level: '9'
          name: faiss-linux-${{ matrix.arch }}-cuda-binaries.zip
          path: artifacts/*

  build-cuda-pack:
    needs: [build-cuda]
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-linux-x64-cuda-binaries.zip
          path: x64-cuda

      - name: Download ARM64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-linux-arm64-cuda-binaries.zip
          path: arm64-cuda

      - name: Prepare Native Runtimes
        run: |
          cp x64-cuda/* src/FaissNET.Linux.Gpu.Cuda/runtimes/linux-x64/native/
          cp arm64-cuda/* src/FaissNET.Linux.Gpu.Cuda/runtimes/linux-arm64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet Package
        run: |
          dotnet pack src/FaissNET.Linux.Gpu.Cuda/Faiss.Linux.Gpu.Cuda.csproj -c Release -o ./nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: faiss-linux-cuda-nupkg.zip
          path: '**/*.nupkg'

  build-rocm:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            opt_level: generic
            rocm_arch: gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1200;gfx1201
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages_one_command: true

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ROCm 7.2
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg2

          sudo apt-get install -y \
            libc6 libstdc++6 libgcc-s1 python3 python3-pip python3-dev \
            zlib1g libzstd1 libnuma1 libelf-dev pkg-config libdrm-dev \
            libtinfo-dev libbz2-1.0 libsqlite3-0 libgomp1 build-essential

          wget https://repo.radeon.com/amdgpu-install/7.2/ubuntu/noble/amdgpu-install_7.2.70200-1_all.deb
          sudo dpkg -i amdgpu-install_7.2.70200-1_all.deb

          # Rewrite the dead amdgpu/7.2 repo to the real one (30.30)
          sudo sed -i 's|amdgpu/7.2|amdgpu/30.30|g' /etc/apt/sources.list.d/amdgpu*.list || true

          sudo apt-get update

          sudo amdgpu-install --usecase=hip,rocm --no-dkms --accept-eula -y
          sudo apt-get install -f -y

      - name: Add ROCm to PATH
        run: echo "/opt/rocm/bin" >> $GITHUB_PATH

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y cmake g++ libopenblas-dev liblapack-dev hip-dev

      - name: Configure Faiss
        working-directory: faiss
        run: |
          cmake -B build . \
            -DFAISS_ENABLE_C_API=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DFAISS_ENABLE_GPU=ON \
            -DFAISS_ENABLE_ROCM=ON \
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} \
            -DFAISS_ENABLE_MKL=OFF \
            -DFAISS_ENABLE_PYTHON=OFF \
            -DBUILD_TESTING=OFF \
            -DFAISS_ENABLE_EXTRAS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DHIP_ARCHITECTURES="${{ matrix.rocm_arch }}"

      - name: Build Faiss C API
        working-directory: faiss
        run: |
          make -C build -j $(nproc) faiss_c

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp faiss/build/c_api/libfaiss_c.so artifacts/
          cp faiss/build/faiss/libfaiss.so artifacts/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          compression-level: '9'
          name: faiss-linux-${{ matrix.arch }}-rocm-binaries.zip
          path: artifacts/*

  build-rocm-pack:
    needs: [build-rocm]
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-linux-x64-rocm-binaries.zip
          path: x64-rocm

      - name: Prepare Native Runtimes
        run: |
          cp x64-rocm/* src/FaissNET.Linux.Gpu.Rocm/runtimes/linux-x64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet Package
        run: |
          dotnet pack src/FaissNET.Linux.Gpu.Rocm/Faiss.Linux.Gpu.Rocm.csproj -c Release -o ./nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: faiss-linux-rocm-nupkg.zip
          path: '**/*.nupkg'