  build-docker:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.docker_platform }}
          load: true
          tags: faiss-test:${{ matrix.arch }}
          provenance: false

      - name: Test Docker image
        run: docker run --rm faiss-test:${{ matrix.arch }}

      - name: Build and push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.docker_platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          provenance: false

  docker-manifest:
    needs: build-docker
    runs-on: ubuntu-24.04

    permissions:
      packages: write
      contents: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64

      - name: Create latest tag manifest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64

  build-docker-cuda:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Faiss submodule commit
        id: faiss-commit
        run: |
          echo "sha=$(git rev-parse HEAD:faiss)" >> $GITHUB_OUTPUT

      - name: Build and push architecture-specific CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          platforms: ${{ matrix.docker_platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cuda:${{ github.sha }}-${{ matrix.arch }}
          provenance: false
          pull: true
          cache-from: type=gha,scope=docker-cuda-${{ matrix.arch }}-${{ steps.faiss-commit.outputs.sha }}
          cache-to: type=gha,mode=min,scope=docker-cuda-${{ matrix.arch }}-${{ steps.faiss-commit.outputs.sha }}

  docker-cuda-manifest:
    needs: build-docker-cuda
    runs-on: ubuntu-24.04

    permissions:
      packages: write
      contents: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch CUDA manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cuda:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cuda:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cuda:${{ github.sha }}-arm64

      - name: Create latest tag manifest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cuda:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cuda:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cuda:${{ github.sha }}-arm64

  publish-github-packages:
    needs: [pack, pack-gpu, pack-native, pack-native-gpu-cuda, pack-native-gpu-rocm, build-linux-pack, build-linux-cuda-pack, build-linux-cuda12-pack, build-linux-rocm-pack, build-macos-pack, build-windows-pack, docker-manifest]
    runs-on: ubuntu-24.04
    
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      
      - name: Download all NuGet Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-nupkg.zip'
          path: artifacts
          merge-multiple: true
      
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "artifacts/**/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
          
  create-release:
    needs: [publish-github-packages]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all NuGet Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-nupkg.zip'
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.nupkg
          generate_release_notes: true
          
  publish-nuget-packages:
    #needs: [create-release]
    needs: [publish-github-packages]
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
    
    steps:
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Download all NuGet Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-nupkg.zip'
          path: artifacts
          merge-multiple: true
      
      - name: NuGet push
        run: |
          dotnet nuget push "artifacts/**/*.nupkg" \
          --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate