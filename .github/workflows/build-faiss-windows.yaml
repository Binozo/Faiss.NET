name: Build and Package Faiss Windows

on:
  push:
    branches: [ main ]
    paths:
      - "faiss"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            opt_level: generic
            msvc_arch: amd64
            llvm_asset: LLVM-19.1.7-win64.exe
            # DYNAMIC_ARCH builds kernels for many x64 CPUs, picks the best at runtime
            openblas_flags: >-
              -DDYNAMIC_ARCH=ON
          - arch: arm64
            runner: windows-11-arm
            opt_level: generic
            msvc_arch: arm64
            llvm_asset: LLVM-19.1.7-woa64.exe
            openblas_flags: >-
              -DTARGET=ARMV8
              -DARCH=arm64
    runs-on: ${{ matrix.runner }}

    env:
      LLVM_VERSION: "19.1.7"
      OPENBLAS_VERSION: "0.3.31"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7

      - name: Install cmake + ninja
        run: uv pip install --system cmake ninja

      # MSVC environment — provides headers, libs, link.exe
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Provides clang-cl (C) + flang-new (Fortran)
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/${{ matrix.llvm_asset }}"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest $url -OutFile llvm.exe -MaximumRetryCount 3

          Start-Process .\llvm.exe -ArgumentList '/S','/D=C:\LLVM' -Wait -NoNewWindow
          'C:\LLVM\bin' | Out-File $env:GITHUB_PATH -Append

          clang-cl --version

      # Build OpenBLAS from source (MSVC ABI)
      - name: Build OpenBLAS ${{ env.OPENBLAS_VERSION }}
        shell: pwsh
        run: |
          git clone --depth 1 -b "v${{ env.OPENBLAS_VERSION }}" `
              https://github.com/OpenMathLib/OpenBLAS.git openblas_src
          cd openblas_src

          $install = "${{ github.workspace }}\openblas_install"

          # C_LAPACK = use f2c-translated C sources instead of Fortran
          # NOFORTRAN = skip Fortran compiler entirely
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DC_LAPACK=ON `
            -DNOFORTRAN=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DBINARY=64 `
            ${{ matrix.openblas_flags }} `
            -DCMAKE_INSTALL_PREFIX="$install"

          cmake --build build --config Release -j
          cmake --install build

          echo "OPENBLAS_PREFIX=$install" | Out-File $env:GITHUB_ENV -Append

          Get-ChildItem $install -Recurse -File | Format-Table FullName, Length

      - name: Configure Faiss
        working-directory: faiss
        shell: pwsh
        run: |
          $prefix = $env:OPENBLAS_PREFIX.Replace('\', '/')
          $lib = (Get-ChildItem "$prefix/lib" -Filter "*openblas*.lib" |
                  Select-Object -First 1).FullName.Replace('\', '/')

          Write-Host "OpenBLAS lib: $lib"

          cmake -B build -G Ninja . `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DBLA_VENDOR=OpenBLAS `
            -DBLAS_LIBRARIES="$lib" `
            -DLAPACK_LIBRARIES="$lib" `
            -DCMAKE_INCLUDE_PATH="$prefix/include" `
            -DFAISS_ENABLE_C_API=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DFAISS_ENABLE_GPU=OFF `
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} `
            -DFAISS_ENABLE_PYTHON=OFF `
            -DFAISS_ENABLE_MKL=OFF `
            -DBUILD_TESTING=OFF `
            -DFAISS_ENABLE_EXTRAS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON

      - name: Build Faiss C API
        working-directory: faiss
        run: cmake --build build --config Release --target faiss_c

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null

          # Faiss DLLs
          Get-ChildItem faiss/build -Recurse -Include faiss.dll, faiss_c.dll |
              Copy-Item -Destination artifacts/

          # OpenBLAS DLL
          Get-ChildItem "$env:OPENBLAS_PREFIX\bin" -Filter *.dll |
              Copy-Item -Destination artifacts/

          Write-Host "`n=== Final artifacts ==="
          Get-ChildItem artifacts/ | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          compression-level: 9
          name: faiss-windows-${{ matrix.arch }}-binaries.zip
          path: artifacts/*
  
  
  build-pack:
    needs: [build]
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-windows-x64-binaries.zip
          path: x64

      - name: Prepare Native Runtimes
        run: |
          cp x64/* src/FaissNET.Windows/runtimes/windows-x64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet Package
        run: |
          dotnet pack src/FaissNET.Windows/Faiss.Windows.csproj -c Release -o ./nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: faiss-windows-nupkg.zip
          path: 'nupkg/*.nupkg'

  build-cuda:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            opt_level: generic
            msvc_arch: amd64
            llvm_asset: LLVM-19.1.7-win64.exe
            # DYNAMIC_ARCH builds kernels for many x64 CPUs, picks the best at runtime
            openblas_flags: >-
              -DDYNAMIC_ARCH=ON
    runs-on: ${{ matrix.runner }}

    env:
      LLVM_VERSION: "19.1.7"
      OPENBLAS_VERSION: "0.3.31"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: '12.8.0'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Build Dependencies (uv)
        shell: pwsh
        run: |
          uv pip install --system cmake ninja

      # MSVC environment — provides headers, libs, link.exe
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Provides clang-cl (C) + flang-new (Fortran)
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/${{ matrix.llvm_asset }}"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest $url -OutFile llvm.exe -MaximumRetryCount 3

          Start-Process .\llvm.exe -ArgumentList '/S','/D=C:\LLVM' -Wait -NoNewWindow
          'C:\LLVM\bin' | Out-File $env:GITHUB_PATH -Append

          clang-cl --version

      # Build OpenBLAS from source (MSVC ABI)
      - name: Build OpenBLAS ${{ env.OPENBLAS_VERSION }}
        shell: pwsh
        run: |
          git clone --depth 1 -b "v${{ env.OPENBLAS_VERSION }}" `
              https://github.com/OpenMathLib/OpenBLAS.git openblas_src
          cd openblas_src

          $install = "${{ github.workspace }}\openblas_install"

          # C_LAPACK = use f2c-translated C sources instead of Fortran
          # NOFORTRAN = skip Fortran compiler entirely
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DC_LAPACK=ON `
            -DNOFORTRAN=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DBINARY=64 `
            ${{ matrix.openblas_flags }} `
            -DCMAKE_INSTALL_PREFIX="$install"

          cmake --build build --config Release -j
          cmake --install build

          echo "OPENBLAS_PREFIX=$install" | Out-File $env:GITHUB_ENV -Append

          Get-ChildItem $install -Recurse -File | Format-Table FullName, Length

      - name: Configure Faiss
        working-directory: faiss
        shell: pwsh
        run: |
          $prefix = $env:OPENBLAS_PREFIX.Replace('\', '/')
          $lib = (Get-ChildItem "$prefix/lib" -Filter "*openblas*.lib" |
                  Select-Object -First 1).FullName.Replace('\', '/')

          Write-Host "OpenBLAS lib: $lib"

          cmake -B build -G Ninja . `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DBLA_VENDOR=OpenBLAS `
            -DBLAS_LIBRARIES="$lib" `
            -DLAPACK_LIBRARIES="$lib" `
            -DCMAKE_INCLUDE_PATH="$prefix/include" `
            -DFAISS_ENABLE_C_API=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DFAISS_ENABLE_GPU=ON `
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} `
            -DFAISS_ENABLE_PYTHON=OFF `
            -DFAISS_ENABLE_MKL=OFF `
            -DBUILD_TESTING=OFF `
            -DFAISS_ENABLE_EXTRAS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90;120"

      - name: Build Faiss C API
        working-directory: faiss
        shell: pwsh
        run: |
          cmake --build build --config Release --target faiss_c

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null

          # Faiss DLLs
          Get-ChildItem faiss/build -Recurse -Include faiss.dll, faiss_c.dll |
              Copy-Item -Destination artifacts/

          # OpenBLAS DLL
          Get-ChildItem "$env:OPENBLAS_PREFIX\bin" -Filter *.dll |
              Copy-Item -Destination artifacts/

          Write-Host "`n=== Final artifacts ==="
          Get-ChildItem artifacts/ | Format-Table Name, Length

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          compression-level: '9'
          name: faiss-windows-${{ matrix.arch }}-cuda-binaries.zip
          path: artifacts/*

  build-cuda-pack:
    needs: [build-cuda]
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-windows-x64-cuda-binaries.zip
          path: x64-cuda

      - name: Prepare Native Runtimes
        run: |
          cp x64-cuda/* src/FaissNET.Windows.Gpu.Cuda/runtimes/windows-x64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet Package
        run: |
          dotnet pack src/FaissNET.Windows.Gpu.Cuda/Faiss.Windows.Gpu.Cuda.csproj -c Release -o ./nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: faiss-windows-cuda-nupkg.zip
          path: 'nupkg/*.nupkg'

  build-rocm:
    if: false # ROCm download currently not working
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            opt_level: generic
            rocm_arch: gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1200;gfx1201
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install HIP SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q1-Win11-For-HIP.exe" `
            -OutFile hip-sdk.exe -UseBasicParsing -MaximumRetryCount 3 -TimeoutSec 300
          
          Start-Process -FilePath ".\hip-sdk.exe" -ArgumentList "/S" -NoNewWindow -Wait
          
          $rocmPath = "C:\Program Files\AMD\ROCm\7.1"
          echo "$rocmPath\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          echo "$rocmPath\hip\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Build Dependencies (uv)
        shell: pwsh
        run: |
          uv pip install --system cmake ninja

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg and install OpenBLAS
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: true
          vcpkgGitCommitId: 'master'
          runVcpkgFormatString: '[`install`, `openblas:${{ matrix.arch }}-windows`]'

      - name: Configure Faiss
        working-directory: faiss
        shell: pwsh
        run: |
          cmake -B build -G Ninja . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DFAISS_ENABLE_C_API=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DFAISS_ENABLE_GPU=ON `
            -DFAISS_ENABLE_ROCM=ON `
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} `
            -DFAISS_ENABLE_PYTHON=OFF `
            -DFAISS_ENABLE_MKL=OFF `
            -DBUILD_TESTING=OFF `
            -DFAISS_ENABLE_EXTRAS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -DBLA_VENDOR=OpenBLAS `
            -DHIP_ARCHITECTURES="${{ matrix.rocm_arch }}"

      - name: Build Faiss C API
        working-directory: faiss
        shell: pwsh
        run: |
          cmake --build build --config Release --target faiss_c

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item faiss/build/c_api/Release/faiss_c.dll artifacts/
          Copy-Item faiss/build/faiss/Release/faiss.dll artifacts/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          compression-level: '9'
          name: faiss-windows-${{ matrix.arch }}-rocm-binaries.zip
          path: artifacts/*