name: Build and Package Faiss Windows

on:
  push:
    branches: [ main ]
    paths:
      - "faiss"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            opt_level: generic
          - arch: arm64
            runner: windows-11-arm
            opt_level: generic
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
    
      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Build Dependencies (uv)
        shell: pwsh
        run: |
          uv pip install --system cmake ninja mkl mkl-include

      - name: Configure Faiss
        working-directory: faiss
        shell: pwsh
        run: |
          cmake -B build . `
            -DFAISS_ENABLE_C_API=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DFAISS_ENABLE_GPU=OFF `
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} `
            -DFAISS_ENABLE_PYTHON=OFF `
            -DFAISS_ENABLE_MKL=OFF `
            -DBUILD_TESTING=OFF `
            -DFAISS_ENABLE_EXTRAS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -DBLA_VENDOR=Intel10_64_dyn

      - name: Build Faiss C API
        working-directory: faiss
        shell: pwsh
        run: |
          cmake --build build --config Release --target faiss_c

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item faiss/build/c_api/Release/faiss_c.dll artifacts/
          Copy-Item faiss/build/faiss/Release/faiss.dll artifacts/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          compression-level: '9'
          name: faiss-windows-${{ matrix.arch }}-binaries.zip
          path: artifacts/*

  build-pack:
    needs: [build]
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-windows-x64-binaries.zip
          path: x64

      - name: Prepare Native Runtimes
        run: |
          cp x64/* src/FaissNET.Windows/runtimes/windows-x64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet Package
        run: |
          dotnet pack src/FaissNET.Windows/Faiss.Windows.csproj -c Release -o ./nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: faiss-windows-nupkg.zip
          path: '**/*.nupkg'

  build-cuda:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            opt_level: generic
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule commit
        working-directory: faiss
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          Write-Host "Faiss submodule commit: $commit"
          if ($commit -ne "e56d96aa01c14eda55def5d4fea2046ac96dcab8") {
            Write-Error "Wrong submodule commit! Expected e56d96a..."
          }

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: '12.8.0'

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          activate-environment: faiss-build
          python-version: '3.11'
          channels: conda-forge

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Build Dependencies
        shell: pwsh
        run: |
          conda install -y cmake ninja mkl mkl-devel

      - name: Configure Faiss
        working-directory: faiss
        shell: pwsh
        run: |
          cmake -B build -G Ninja . `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DFAISS_ENABLE_C_API=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DFAISS_ENABLE_GPU=ON `
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} `
            -DFAISS_ENABLE_PYTHON=OFF `
            -DFAISS_ENABLE_MKL=OFF `
            -DBUILD_TESTING=OFF `
            -DFAISS_ENABLE_EXTRAS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -DBLA_VENDOR=Intel10_64_dyn `
            -DCMAKE_CUDA_ARCHITECTURES="50;52;60;61;75;80;86;89;90;120"

      - name: Build Faiss C API
        working-directory: faiss
        shell: pwsh
        run: |
          cmake --build build --config Release --target faiss_c

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item faiss/build/c_api/Release/faiss_c.dll artifacts/
          Copy-Item faiss/build/faiss/Release/faiss.dll artifacts/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          compression-level: '9'
          name: faiss-windows-${{ matrix.arch }}-cuda-binaries.zip
          path: artifacts/*

  build-cuda-pack:
    needs: [build-cuda]
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: faiss-windows-x64-cuda-binaries.zip
          path: x64-cuda

      - name: Prepare Native Runtimes
        run: |
          cp x64-cuda/* src/FaissNET.Windows.Gpu.Cuda/runtimes/windows-x64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet Package
        run: |
          dotnet pack src/FaissNET.Windows.Gpu.Cuda/Faiss.Windows.Gpu.Cuda.csproj -c Release -o ./nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: faiss-windows-cuda-nupkg.zip
          path: '**/*.nupkg'

  build-rocm:
    if: false # ROCm download currently not working
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            opt_level: generic
            rocm_arch: gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1200;gfx1201
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install HIP SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q1-Win11-For-HIP.exe" `
            -OutFile hip-sdk.exe -UseBasicParsing -MaximumRetryCount 3 -TimeoutSec 300
          
          Start-Process -FilePath ".\hip-sdk.exe" -ArgumentList "/S" -NoNewWindow -Wait
          
          $rocmPath = "C:\Program Files\AMD\ROCm\7.1"
          echo "$rocmPath\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          echo "$rocmPath\hip\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          activate-environment: faiss-build
          python-version: '3.11'
          channels: conda-forge

      - name: Install Build Dependencies
        shell: pwsh
        run: |
          conda install -y cmake ninja mkl mkl-devel

      - name: Configure Faiss
        working-directory: faiss
        shell: pwsh
        run: |
          cmake -B build -G Ninja . `
            -DFAISS_ENABLE_C_API=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DFAISS_ENABLE_GPU=ON `
            -DFAISS_ENABLE_ROCM=ON `
            -DFAISS_OPT_LEVEL=${{ matrix.opt_level }} `
            -DFAISS_ENABLE_PYTHON=OFF `
            -DFAISS_ENABLE_MKL=OFF `
            -DBUILD_TESTING=OFF `
            -DFAISS_ENABLE_EXTRAS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -DBLA_VENDOR=Intel10_64_dyn `
            -DHIP_ARCHITECTURES="${{ matrix.rocm_arch }}"

      - name: Build Faiss C API
        working-directory: faiss
        shell: pwsh
        run: |
          cmake --build build --config Release --target faiss_c

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item faiss/build/c_api/Release/faiss_c.dll artifacts/
          Copy-Item faiss/build/faiss/Release/faiss.dll artifacts/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          compression-level: '9'
          name: faiss-windows-${{ matrix.arch }}-rocm-binaries.zip
          path: artifacts/*